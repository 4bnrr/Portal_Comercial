name: Sincronizar CVCRM na Vercel

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-hourly-cvcrm-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Consultar CVCRM e publicar catalogo
        env:
          CRON_SECRET: ${{ secrets.VERCEL_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --max-time 300 \
            --retry 2 \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://simuladorest1.vercel.app/api/cron/sync
