name: Sincronizar CVCRM na Vercel

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vercel-hourly-cvcrm-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar portal
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --omit=dev

      - name: Consultar CVCRM e publicar catalogo
        env:
          CVCRM_DOMAIN: ${{ secrets.CVCRM_DOMAIN }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          CVCRM_REQUEST_GAP_MS: 3200
          CVCRM_PHASE_GAP_MS: 0
          CVCRM_AUTO_SYNC: false
        run: node server.js --sync-once

      - name: Gerar catalogo estatico
        run: npm run build:static-data

      - name: Salvar catalogo atualizado
        run: |
          git config user.name "estacao1-sync"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/bootstrap.json
          git diff --cached --quiet || git commit -m "data: atualiza catalogo CVCRM"
          git push
