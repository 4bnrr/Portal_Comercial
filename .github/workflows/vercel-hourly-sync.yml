name: Sincronizar CVCRM na Vercel

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-hourly-cvcrm-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar portal
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --omit=dev

      - name: Consultar CVCRM e publicar catalogo
        env:
          CRON_SECRET: ${{ secrets.VERCEL_CRON_SECRET }}
          CVCRM_DOMAIN: ${{ secrets.CVCRM_DOMAIN }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          CVCRM_REQUEST_GAP_MS: 3200
          CVCRM_PHASE_GAP_MS: 0
          CVCRM_AUTO_SYNC: false
          VERCEL_PUBLISH_URL: https://simuladorest1.vercel.app/api/cron/publish
        run: node server.js --sync-once
