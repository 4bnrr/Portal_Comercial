name: Sincronizar CVCRM na Vercel

on:
  schedule:
    # Executa a cada 15 minutos, evitando o pico do minuto zero.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vercel-hourly-cvcrm-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar portal
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --omit=dev

      - name: Consultar CVCRM e publicar catalogo
        env:
          CVCRM_DOMAIN: ${{ secrets.CVCRM_DOMAIN }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          CVCRM_REQUEST_GAP_MS: 3200
          CVCRM_PHASE_GAP_MS: 0
          CVCRM_AUTO_SYNC: false
          CVDW_INCREMENTAL_OVERLAP_MS: 600000
          CVDW_FULL_SYNC_INTERVAL_HOURS: 24
        run: node server.js --sync-once

      - name: Gerar catalogo estatico
        run: npm run build:static-data

      - name: Salvar catalogo atualizado
        shell: bash
        run: |
          git config user.name "estacao1-sync"
          git config user.email "actions@users.noreply.github.com"

          git add public/data/bootstrap.json

          if git diff --cached --quiet; then
            echo "Catalogo sem alteracoes."
            exit 0
          fi

          git commit -m "data: atualiza catalogo CVCRM"

          for tentativa in 1 2 3; do
            echo "Tentativa $tentativa de sincronizacao"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Conflito durante o rebase"
              git rebase --abort
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Catalogo atualizado com sucesso"
              exit 0
            fi

            echo "Push rejeitado. Tentando novamente"
            sleep 5
          done

          echo "Falha apos 3 tentativas"
          exit 1
